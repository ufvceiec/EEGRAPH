name: Tests

on:
  push:
    branches: [ main, master, develop, develop-refactor, "feature/**" ]
  pull_request:
    branches: [ main, master, develop, develop-refactor ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (no EEG files required)
        run: |
          python -m pytest tests/tests.py::TestTools \
                           tests/tests.py::TestNewConnectivityMeasures \
                           tests/tests.py::TestNewGraphMetrics \
                           -v --tb=short
